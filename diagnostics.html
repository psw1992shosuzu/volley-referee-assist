<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10334b">
<title>Android動作診断｜Volley審判</title>
<style>
:root{font-family:system-ui,"Noto Sans JP",sans-serif;color:#19384b;background:#f3f6f8}
*{box-sizing:border-box}body{margin:0}main{max-width:680px;margin:auto;padding:16px}
h1{font-size:21px;margin:0 0 8px}p{line-height:1.6}
.card{padding:16px;background:white;border:1px solid #dce6eb;border-radius:12px;margin:12px 0}
button,a.action{display:inline-block;border:0;background:#12668e;color:white;padding:12px 14px;border-radius:9px;font-weight:700;font-size:15px;text-decoration:none;margin:4px 5px 4px 0}
button.secondary{background:#e3edf3;color:#164c65}
table{width:100%;border-collapse:collapse;font-size:13px}
td{padding:10px 5px;border-bottom:1px solid #e2e9ee;vertical-align:top;overflow-wrap:anywhere}
td:first-child{font-weight:700;width:43%}
.good{color:#0a7253;font-weight:800}.warn{color:#9a5a03;font-weight:800}
small{color:#506777}textarea{width:100%;height:150px;border-radius:8px;border:1px solid #bacbd5;padding:10px;font:12px/1.5 monospace}
</style>
</head>
<body><main>
<h1>Android動作診断</h1>
<p>審判補助アプリの導入確認用です。このページは端末情報や試合データを外部に送信しません。</p>
<div class="card">
<button id="run">診断を実行／更新</button>
<a class="action" href="./index.html">試合画面へ</a>
<p id="headline" aria-live="polite">「診断を実行」を押してください。</p>
<table aria-label="診断結果"><tbody id="rows"></tbody></table>
</div>
<div class="card">
<h2>結果を共有する</h2>
<p><small>個人情報や試合の内容は含めず、機能の使用可否だけをまとめます。</small></p>
<textarea id="report" readonly aria-label="診断結果テキスト"></textarea>
<button class="secondary" id="copy">結果をコピー</button>
</div>
<div class="card">
<h2>機内モードでの確認</h2>
<p>診断ページでキャッシュが準備済みと表示されても、オフライン起動が保証されたわけではありません。いったんオンラインでアプリを開き、その後、機内モードでホーム画面のアイコンから再起動してください。得点入力と保存復元も確認してください。</p>
</div>
</main>
<script>
'use strict';
const byId = id => document.getElementById(id);
const rows = [];
function add(label, value, good) { rows.push({label, value:String(value), good}); }
function show() {
  const tbody = byId('rows'); tbody.replaceChildren();
  for (const r of rows) {
    const tr = document.createElement('tr'), left = document.createElement('td'), right = document.createElement('td');
    left.textContent=r.label; right.textContent=r.value; right.className=r.good?'good':'warn'; tr.append(left,right); tbody.append(tr);
  }
  const report = 'Volley審判 Android診断\n' + new Date().toLocaleString('ja-JP') + '\n' + rows.map(r=>r.label+'：'+r.value).join('\n');
  byId('report').value=report;
}
async function check() {
  rows.length=0; byId('headline').textContent='確認中…';
  const secure = window.isSecureContext;
  add('HTTPS / 安全な接続', secure?'はい':'いいえ', secure);
  add('端末', /Android/i.test(navigator.userAgent)?'Android':'Android以外', /Android/i.test(navigator.userAgent));
  add('画面サイズ', innerWidth+' × '+innerHeight+' px', innerWidth>innerHeight);
  add('画面向き', innerWidth>innerHeight?'横向き':'縦向き', innerWidth>innerHeight);
  const standalone = matchMedia('(display-mode: standalone)').matches || Boolean(navigator.standalone);
  add('ホーム画面から独立起動',standalone?'はい':'ブラウザ内（未インストール等）',standalone);
  add('通信状態（参考）',navigator.onLine?'オンライン表示':'オフライン表示',true);
  let storage=false;
  try {const k='__volley_diag__';localStorage.setItem(k,'ok');storage=localStorage.getItem(k)==='ok';localStorage.removeItem(k);}catch(e){}
  add('端末内保存',storage?'利用可能':'利用不可',storage);
  add('画面保持機能',secure && !!(navigator.wakeLock && navigator.wakeLock.request)?'対応APIあり':'未対応／条件不足',secure && !!(navigator.wakeLock && navigator.wakeLock.request));
  add('全画面機能',!!document.documentElement.requestFullscreen?'対応APIあり':'未対応',!!document.documentElement.requestFullscreen);
  let reg=null;
  if ('serviceWorker' in navigator) {
    try {
      reg=await navigator.serviceWorker.getRegistration('./');
      if(!reg && secure) reg=await navigator.serviceWorker.register('./sw.js');
    } catch(e) { add('Service Worker登録', '失敗: '+e.name,false); }
  }
  add('Service Worker',reg && (reg.active || reg.installing || reg.waiting)?'登録あり':'未登録',!!reg);
  add('ページのオフライン制御',navigator.serviceWorker?.controller?'有効':'無効（初回は再読み込み）',!!navigator.serviceWorker?.controller);
  let cached=0;
  const paths=['index.html','manifest.webmanifest','icon-192.png','icon-512.png','diagnostics.html'];
  if ('caches' in window) {
    try {
      const names=await caches.keys();
      const active=names.filter(n=>n.startsWith('volley-referee-assist-')).sort().at(-1);
      for (const path of paths) if (await caches.match(new URL(path, location.href))) cached++;
      add('オフライン用キャッシュ',cached+'/'+paths.length+'ファイル',cached===paths.length);
      add('キャッシュ識別子',active||'未作成',!!active);
    } catch(e) {add('オフライン用キャッシュ','確認不可: '+e.name,false);}
  } else add('オフライン用キャッシュ','非対応',false);
  const ready=secure && !!reg && !!navigator.serviceWorker?.controller && storage && cached===paths.length;
  byId('headline').textContent=ready?'準備チェックは合格です。最後に機内モードで実起動を確認してください。':'未完了の項目があります。オンラインでアプリを一度開き、再読み込み後に再診断してください。';
  show();
}
byId('run').addEventListener('click',check);
byId('copy').addEventListener('click',async()=>{
  const text=byId('report').value;
  try {await navigator.clipboard.writeText(text);byId('copy').textContent='コピーしました';}
  catch(e){byId('report').select();byId('copy').textContent='結果を選択しました';}
});
window.addEventListener('load',check);
</script>
</body></html>
